<!DOCTYPE html>
<html>
<head>
  <title>Scopa Game</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <h1>Scopa Game</h1>
  <h2 id="showName"></h2>
  
  <div id="gamePanel">
    <div id="theirHand">
      <button id="theirCard1" disabled>X</button>
      <button id="theirCard2" disabled>X</button>
      <button id="theirCard3" disabled>X</button>
    </div>

    <br>

    <div id="board"></div>

    <br>

    <div id="player">
      <button class="card" id="card1" disabled></button>
      <button class="card" id="card2" disabled></button>
      <button class="card" id="card3" disabled></button>
      <div id="numScope"></div>
    </div>
  </div>

  <div id="risultato"></div>
</body>
</html>
